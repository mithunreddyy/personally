<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040404" />
    <script>
      try {
        var theme = localStorage.getItem("theme") === "light" ? "light" : "dark";
      } catch (e) {
        var theme = "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f6f7f9" : "#040404");
    </script>
    <link rel="alternate" type="application/rss+xml" title="Mithun Reddy, writing" href="%BASE_URL%feed.xml" />

    <!-- Bump ?v= whenever the icon changes: browsers cache favicons by URL and keep the old one otherwise -->
    <link rel="icon" href="%BASE_URL%favicon.ico?v=11" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=11" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png?v=11" />
    <link rel="manifest" href="%BASE_URL%manifest.json?v=11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mithun" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
