<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A small hand-drawn creature peeking up from the bottom edge, hands on the edge. No background: it sits on the tab -->
  <style>
    .ink { fill: #15171a }
    .stroke { stroke: #15171a }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ececec }
      .stroke { stroke: #ececec }
    }
  </style>
  <defs>
    <!-- Holes in the body: the eyes, and a thin gap around each hand, so the tab colour shows through in either theme -->
    <mask id="cut">
      <rect width="32" height="32" fill="#fff" />
      <ellipse cx="12.9" cy="21" rx="1.75" ry="2.35" transform="rotate(-6 12.9 21)" fill="#000" />
      <ellipse cx="19.3" cy="20.8" rx="1.75" ry="2.35" transform="rotate(5 19.3 20.8)" fill="#000" />
      <path d="M6.8 32C6.4 28.8 7.6 26.9 9.3 27C11 27.1 11.6 29.1 11.2 32Z" fill="#000" stroke="#000" stroke-width="1.8" />
      <path d="M20.8 32C20.4 29.1 21 27.1 22.7 27C24.4 26.9 25.6 28.8 25.2 32Z" fill="#000" stroke="#000" stroke-width="1.8" />
    </mask>
  </defs>
  <!-- tuft of hair -->
  <path class="stroke" d="M15.8 12.6C15.4 10.1 17.2 8.2 19.3 9.1" fill="none" stroke-width="1.7" stroke-linecap="round" />
  <!-- head, slightly uneven like a pen sketch, cut off by the bottom edge -->
  <path class="ink" mask="url(#cut)" d="M5.6 32C5.2 20.6 9.6 12.3 16.1 12.4C22.8 12.5 26.9 20.7 26.4 32Z" />
  <!-- hands gripping the bottom edge -->
  <path class="ink" d="M6.8 32C6.4 28.8 7.6 26.9 9.3 27C11 27.1 11.6 29.1 11.2 32Z" />
  <path class="ink" d="M20.8 32C20.4 29.1 21 27.1 22.7 27C24.4 26.9 25.6 28.8 25.2 32Z" />
</svg>
